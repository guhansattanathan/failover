name: failover

x-backend: &backend
  build: ./backend
  environment: &backend-env
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-failover}
    POSTGRES_USER: ${POSTGRES_USER:-failover}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-only-change-before-any-hosting}
    MONGO_URL: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-failover}:${RABBITMQ_PASSWORD:-local-demo-password}@rabbitmq:5672//
    SAFE_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-failover}
      POSTGRES_USER: ${POSTGRES_USER:-failover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-failover}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-demo-password}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 32mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *backend
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      init: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 15
  worker:
    <<: *backend
    command: [celery, -A, failover, worker, --loglevel=info, --concurrency=2, --hostname=worker@%h]
    depends_on:
      init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A failover inspect ping -d worker@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
  recovery:
    <<: *backend
    command: [python, manage.py, recover_jobs, --loop]
    depends_on:
      init: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:${FRONTEND_PORT:-8080}:80']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
